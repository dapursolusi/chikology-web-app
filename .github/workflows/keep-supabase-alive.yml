name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 12 * * 1,4' # Every Monday and Thursday at 12:00 PM UTC
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        target: [prod, dev]
    name: ping-${{ matrix.target }}
    steps:
      - name: Ping ${{ matrix.target }} Supabase
        env:
          SUPABASE_URL: ${{ matrix.target == 'prod' && secrets.SUPABASE_URL_PROD || secrets.SUPABASE_URL_DEV }}
          SUPABASE_ANON_KEY: ${{ matrix.target == 'prod' && secrets.SUPABASE_ANON_KEY_PROD || secrets.SUPABASE_ANON_KEY_DEV }}
        run: |
          curl -sf "${SUPABASE_URL}/rest/v1/users?limit=1" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -o /dev/null
